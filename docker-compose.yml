services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - '4000:4000'
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    command: yarn start:dev
    depends_on:
      - mongo
      - redis
    networks:
      - app-network
    restart: always

  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network
    restart: always

  redis:
    image: redis:alpine
    ports:
      - '6379:6379' # optional (keep only if you need host access)
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - app-network
    restart: always

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
